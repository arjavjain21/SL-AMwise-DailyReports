name: Daily Campaign Reporting

on:
  schedule:
    # Runs every day at 01:00 AM EST (06:00 UTC)
    - cron: "0 5 * * *"
  workflow_dispatch: # Manual trigger option

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary gspread google-auth

    - name: Run reporting script
      env:
        REPORTING_DB_URL: ${{ secrets.REPORTING_DB_URL }}
        CLIENTS_DB_URL: ${{ secrets.CLIENTS_DB_URL }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python AMwise_daily_reporting_script.py
